# Canonical head-to-head on SPY: baselines vs. heuristic vol gate vs. Gaussian
# HMMs (K=2, K=3), identical walk-forward schedule, OOS window, and cost sweep.
# HMM exposure maps follow the variance ordering: regime 0 = calmest.
name: comparison_spy
seed: 0
params:
  universe: ["SPY"]
  start: "2000-01-01"
  risk_free: "^IRX"              # cash leg: flat weight earns the lagged T-bill rate
  cost_bps: 5.0
  cost_sweep_bps: [0, 5, 20]
  trend_window: 200
  train_size: 1260
  test_size: 252
  scheme: expanding
  subperiods:                    # robustness: is the result one lucky era?
    - ["2005-01-01", "2009-12-31"]
    - ["2010-01-01", "2019-12-31"]
    - ["2020-01-01", "2026-12-31"]
  sens_vol_windows: [10, 20, 60]
  sens_vol_quantiles: [0.7, 0.8, 0.9]
  regime_models:
    - name: vol20q80
      type: volatility
      vol_window: 20
      quantile: 0.8
      exposure: {0: 1.0, 1: 0.0}
    - name: hmm2
      type: hmm
      n_regimes: 2
      n_restarts: 3
      max_iter: 100
      exposure: {0: 1.0, 1: 0.0}
      probability_scaled: true     # adds hmm2p_bh: exposure = filtered P(calm)
      bands: [0.05, 0.1, 0.2]      # no-trade band sweep on the scaled exposure
    - name: hmm3
      type: hmm
      n_regimes: 3
      n_restarts: 3
      max_iter: 100
      exposure: {0: 1.0, 1: 1.0, 2: 0.0}   # flat only in the most turbulent state
