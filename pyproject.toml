[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regimelab"
version = "0.1.0"
description = "A reproducible research platform for market regime detection and systematic trading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Ryadi", email = "mohamed.ryadi@outlook.fr" }]
keywords = ["quantitative-finance", "regime-detection", "backtesting", "time-series"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Statistical regime models (added when we commit to a methodology).
models = [
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]
# Data acquisition. Kept optional so the core library stays source-agnostic.
data = [
    "yfinance>=0.2",
]
notebooks = [
    "jupyter",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regimelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
